<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
  <meta name="theme-color" content="#070913" />
  <meta name="description" content="CHORUS β v7.8.4 Control Console — Dual-Plane Discord Agentic Operating System by CHORUS Labs (inf3rno)." />
  <title>CHORUS β Control Console • v7.8.4</title>
  <style>
    :root {
      --bg: #070913;
      --surface: #0D1222;
      --primary: #5865F2;
      --accent: #8B5CF6;
      --text: #F8FAFF;
      --muted: #94A3B8;
      --border: rgba(255, 255, 255, 0.1);
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #portal-frame {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      border: 0;
      display: block;
      background: var(--bg);
    }
    #boot-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      background:
        radial-gradient(circle at 20% 20%, rgba(88, 101, 242, 0.22), transparent 45%),
        radial-gradient(circle at 80% 80%, rgba(139, 92, 246, 0.18), transparent 45%),
        var(--bg);
      transition: opacity 0.28s ease, visibility 0.28s ease;
    }
    #boot-splash.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .splash-card {
      width: 100%;
      max-width: 380px;
      padding: 28px 24px;
      border-radius: 18px;
      background: rgba(13, 18, 34, 0.9);
      border: 1px solid var(--border);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55);
    }
    .splash-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #A5B4FC;
      background: rgba(88, 101, 242, 0.16);
      border: 1px solid rgba(88, 101, 242, 0.35);
      margin-bottom: 14px;
    }
    .splash-title {
      font-size: 1.55rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
    }
    .splash-title span {
      color: var(--accent);
    }
    .splash-sub {
      font-size: 0.84rem;
      color: var(--muted);
      line-height: 1.5;
      margin-bottom: 18px;
    }
    .spinner {
      width: 28px;
      height: 28px;
      margin: 0 auto 14px;
      border-radius: 50%;
      border: 3px solid rgba(139, 92, 246, 0.22);
      border-top-color: var(--accent);
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="boot-splash" role="status" aria-live="polite">
    <div class="splash-card">
      <div class="splash-badge">CHORUS Labs &bull; v7.8.4</div>
      <div class="splash-title">CHORUS <span>&beta;</span></div>
      <p class="splash-sub">Connecting to Google Apps Script Control Plane&hellip;</p>
      <div class="spinner" aria-hidden="true"></div>
    </div>
  </div>

  <iframe
    id="portal-frame"
    src="https://script.google.com/macros/s/AKfycbw3FIIxHukcREw85F_D7rxHEALW-6xSWWjgYfvddmfTGGYrG1Q5h7NUa6tnX398ZIJD/exec"
    title="CHORUS β Control Console v7.8.4"
    allow="fullscreen; clipboard-read; clipboard-write"
    allowfullscreen
    referrerpolicy="strict-origin-when-cross-origin"
  ></iframe>

  <script>
    (function () {
      const GAS_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbw3FIIxHukcREw85F_D7rxHEALW-6xSWWjgYfvddmfTGGYrG1Q5h7NUa6tnX398ZIJD/exec";
      const STORAGE_KEY = "chorus_portal_session_v784";
      const THEME_KEY = "chorus_portal_theme";
      const frame = document.getElementById("portal-frame");
      const splash = document.getElementById("boot-splash");

      // Forward query parameters (e.g., password reset token/email/theme/server) to GAS iframe
      try {
        const currentParams = new URLSearchParams(window.location.search);
        const savedTheme = localStorage.getItem(THEME_KEY);
        if (savedTheme && !currentParams.has("theme")) {
          currentParams.set("theme", savedTheme);
        }
        const qs = currentParams.toString();
        if (qs) {
          frame.src = GAS_WEBAPP_URL + "?" + qs;
        }
      } catch (e) {}

      function hideSplash() {
        if (splash && !splash.classList.contains("hidden")) {
          splash.classList.add("hidden");
        }
      }

      function readSavedSession() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          return raw ? JSON.parse(raw) : null;
        } catch (e) {
          return null;
        }
      }

      function clearSavedSession() {
        try {
          localStorage.removeItem(STORAGE_KEY);
        } catch (e) {}
      }

      function saveSessionIfRemembered(data) {
        try {
          if (data && data.token) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify({
              token: data.token,
              user: data.user || null,
              activeServerId: data.activeServerId || null,
              theme: data.theme || localStorage.getItem(THEME_KEY) || "dark",
              updatedAt: Date.now()
            }));
          } else {
            clearSavedSession();
          }
        } catch (e) {}
      }

      function sendToGas(payload) {
        try {
          if (frame && frame.contentWindow) {
            frame.contentWindow.postMessage(
              Object.assign({ source: "CHORUS_GH_PAGES" }, payload),
              "*"
            );
          }
        } catch (e) {}
      }

      // Listen for lifecycle & session sync messages from the GAS iframe
      window.addEventListener("message", function (event) {
        const data = event.data;
        if (!data || typeof data !== "object" || data.source !== "CHORUS_GAS_APP") return;

        if (data.theme && ["dark", "light", "auto"].includes(data.theme)) {
          try { localStorage.setItem(THEME_KEY, data.theme); } catch (e) {}
        }

        if (data.type === "CHORUS_APP_LOADED") {
          hideSplash();
          const saved = readSavedSession();
          sendToGas({
            type: "CHORUS_RESTORE_SESSION",
            token: saved ? saved.token : null,
            user: saved ? saved.user : null,
            activeServerId: saved ? saved.activeServerId : null,
            theme: localStorage.getItem(THEME_KEY) || "dark"
          });
        } else if (data.type === "CHORUS_APP_READY") {
          hideSplash();
        } else if (data.type === "CHORUS_SESSION_SAVED") {
          saveSessionIfRemembered(data);
        } else if (data.type === "CHORUS_SESSION_CLEARED") {
          clearSavedSession();
        }
      });

      frame.addEventListener("load", function () {
        setTimeout(hideSplash, 700);
      });

      // Safety timeout so splash never blocks the console even if cross-origin postMessage is delayed
      setTimeout(hideSplash, 4500);
    })();
  </script>
</body>
</html>
